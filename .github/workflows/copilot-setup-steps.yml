# Prepares the environment for GitHub's Copilot cloud agent (D-011): Python with the pinned
# requirements and a built Lean package, so the agent can run scripts/gate.py itself.
# GitHub runs the job named copilot-setup-steps before the agent starts; it only takes
# effect on the default branch. Kept running by the Builder.
# Sigma2 is not reachable from here (D-009): the cloud agent cannot collect or launch.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt

      - name: Install Lean and build
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          use-github-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('dashboard/package-lock.json') != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: hashFiles('dashboard/package-lock.json') != ''
        working-directory: dashboard
        run: npm ci
