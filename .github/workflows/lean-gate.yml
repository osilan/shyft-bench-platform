# Runs the same gate as the local Copilot hooks: scripts/gate.py.
# Owned by DevOps (pipeline); the checks themselves belong to the Independent Auditor.
name: Lean gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt

      - name: Install Lean and build
        if: hashFiles('lakefile.lean', 'lakefile.toml') != ''
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          use-github-cache: true

      # Pull requests into a review branch (not main): checks and theorems may only be added;
      # a changed or removed statement fails and waits for the founder, who records the additions
      # in audit/fingerprint.tsv once, before the review branch goes to main. Everything else
      # (main, pull requests into main) is strict. Decided in the script so the log shows why.
      - name: Lean gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          base="${BASE:-$PR_BASE}"
          echo "event=$EVENT base_ref=$BASE pull_request.base.ref=$PR_BASE"
          if [ "$EVENT" = "pull_request" ] && [ -n "$base" ] && [ "$base" != "main" ]; then
            echo "mode: append-only against $base"
            git fetch --depth=1 origin "$base"
            git show "FETCH_HEAD:audit/fingerprint.tsv" > "$RUNNER_TEMP/base-fingerprint.tsv"
            python scripts/gate.py check --no-committed --mode append-only \
              --against "$RUNNER_TEMP/base-fingerprint.tsv"
          else
            echo "mode: strict"
            python scripts/gate.py check
          fi
