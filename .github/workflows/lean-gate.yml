# Runs the same gate as the local Copilot hooks: scripts/gate.py.
# Kept running by the Builder; the checks themselves belong to the Independent Auditor.
name: Lean gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: python -m pip install -r requirements.txt

      - name: Install Lean and build
        if: hashFiles('lakefile.lean', 'lakefile.toml') != ''
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          auto-config: false
          build: true
          use-github-cache: true

      # Every pull request goes into main. audit/fingerprint.tsv must match the build, and
      # statements may only be added relative to the base. A pull request that changes or
      # removes a statement passes only with the label `statements-approved`, which the founder
      # adds after reading the changed statements. Pushes to main are strict.
      - name: Lean gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'statements-approved') }}
        run: |
          echo "event=$EVENT base=$PR_BASE statements-approved=$APPROVED"
          if [ "$EVENT" = "pull_request" ] && [ "$APPROVED" != "true" ]; then
            echo "mode: additions only against $PR_BASE"
            git fetch --depth=1 origin "$PR_BASE"
            git show "FETCH_HEAD:audit/fingerprint.tsv" > "$RUNNER_TEMP/base-fingerprint.tsv"
            python scripts/gate.py check --mode append-only \
              --against "$RUNNER_TEMP/base-fingerprint.tsv"
          else
            echo "mode: strict"
            python scripts/gate.py check
          fi
